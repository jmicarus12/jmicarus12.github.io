<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SSH">
  <!-- Terminal prompt: a shell chevron and cursor rule, on a slate tile.
       Generic iconography rather than a brand mark, since OpenSSH has none. -->
  <rect width="64" height="64" rx="13" fill="#2F3F50"/>
  <g fill="none" stroke="#FCFDFE" stroke-width="5.4"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 21 L25.5 31.6 L16 41.6"/>
    <path d="M30.6 41.6 H46.6"/>
  </g>
</svg>
